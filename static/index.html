<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="name">Menu</h1>
    <div class="sub" id="table"></div>
  </header>
  <div class="bar" role="group" aria-label="Filters">
    <button class="chip" id="vegOnly" aria-pressed="false">Veg only</button>
    <button class="chip" id="hideSold" aria-pressed="false">Hide sold out</button>
  </div>
  <main id="menu" aria-live="polite"><div class="empty">Loading menu…</div></main>
  <div id="status"></div>
</div>
<script src="/menu.js"></script>
</body>
</html>
